<!doctype html><html lang="tr"><head><meta charset="utf-8"><style>
@font-face{font-family:Mont;src:url(../../assets/fontlar/Montserrat-VF.ttf);font-weight:100 900}
*{box-sizing:border-box}
html,body{margin:0;width:1080px;height:1920px;background:#f4f6f9;font-family:Mont,sans-serif;color:#1d2433;overflow:hidden}
.ust{background:#fff;padding:120px 56px 40px;box-shadow:0 2px 14px rgba(0,0,0,.06)}
.marka{font-weight:800;font-size:44px;color:#2e6ca4;letter-spacing:-.02em;margin-bottom:34px}
.marka span{color:#9aa6b8;font-weight:500}
.kutu{display:flex;align-items:center;gap:22px;background:#fff;border:3px solid #d5dce6;border-radius:60px;padding:30px 40px;font-size:40px;font-weight:500}
.kutu.aktif{border-color:#2e6ca4;box-shadow:0 0 0 8px rgba(46,108,164,.12)}
.ikon{width:40px;height:40px;border:5px solid #8a96a8;border-radius:50%;position:relative;flex:none}
.ikon::after{content:"";position:absolute;width:18px;height:5px;background:#8a96a8;right:-14px;bottom:-6px;transform:rotate(45deg)}
.imlec{display:inline-block;width:4px;height:46px;background:#2e6ca4;vertical-align:middle;margin-left:4px;animation:none}
.sonuclar{padding:40px 56px;opacity:var(--s,0);transform:translateY(calc((1 - var(--s,0)) * 40px))}
.say{font-size:26px;color:#7a8597;margin-bottom:30px}
.sonuc{background:#fff;border-radius:28px;padding:40px 44px;margin-bottom:28px}
.sonuc.bir{border:4px solid #2e6ca4;box-shadow:0 18px 50px rgba(46,108,164,calc(.25 * var(--v,0)));transform:scale(calc(1 + .03 * var(--v,0)))}
.site{display:flex;align-items:center;gap:20px;font-size:26px;color:#4d5a6e;margin-bottom:16px}
.site img{width:64px;height:64px;border-radius:50%;object-fit:cover;background:#fff;border:2px solid #e3e8ef}
.site b{display:block;color:#1d2433;font-size:30px}
.baslik{font-size:42px;font-weight:700;color:#1a4f86;line-height:1.2;margin-bottom:14px}
.aciklama{font-size:29px;line-height:1.45;color:#4d5a6e}
.etiketler{display:flex;gap:12px;margin-top:22px;flex-wrap:wrap}
.etiketler span{font-size:24px;font-weight:600;background:#eaf2fa;color:#2e6ca4;padding:10px 20px;border-radius:30px}
.gri{height:30px;border-radius:15px;background:#e3e8ef;margin:14px 0}
</style></head><body>
<div class="ust">
  <div class="marka">ara<span>.</span></div>
  <div class="kutu" id="kutu"><div class="ikon"></div><div><span id="yazi"></span><span class="imlec" id="imlec"></span></div></div>
</div>
<div class="sonuclar" id="sonuclar">
  <div class="say">Yaklaşık 48.200 sonuç</div>
  <div class="sonuc bir">
    <div class="site"><img src="../../assets/logo.png"><div><b>Ökmen Havalandırma</b>okmenhavalandirma.com</div></div>
    <div class="baslik">Diyarbakır Ocakbaşı ve Restoran Davlumbazı</div>
    <div class="aciklama">Duman, ısı ve kokuya kalıcı çözüm. Ücretsiz keşif, mutfağınıza özel davlumbaz ve egzoz sistemi. Diyarbakır merkezli ekip.</div>
    <div class="etiketler"><span>Ücretsiz keşif</span><span>Davlumbaz</span><span>Bakım &amp; servis</span></div>
  </div>
  <div class="sonuc"><div class="gri" style="width:45%"></div><div class="gri" style="width:85%;height:38px"></div><div class="gri" style="width:95%"></div><div class="gri" style="width:70%"></div></div>
  <div class="sonuc"><div class="gri" style="width:38%"></div><div class="gri" style="width:78%;height:38px"></div><div class="gri" style="width:92%"></div><div class="gri" style="width:60%"></div></div>
  <div class="sonuc"><div class="gri" style="width:40%"></div><div class="gri" style="width:82%;height:38px"></div><div class="gri" style="width:90%"></div><div class="gri" style="width:66%"></div></div>
  <div class="sonuc"><div class="gri" style="width:40%"></div><div class="gri" style="width:82%;height:38px"></div><div class="gri" style="width:90%"></div><div class="gri" style="width:66%"></div></div>
</div>
<script>
const q=new URLSearchParams(location.search), metin="diyarbakır restoran havalandırma";
const n=+(q.get('n')||metin.length), s=+(q.get('s')||0), v=+(q.get('v')||0);
document.getElementById('yazi').textContent=metin.slice(0,n);
document.getElementById('imlec').style.opacity=(+(q.get('i')||1));
document.getElementById('kutu').classList.toggle('aktif', n>0);
document.documentElement.style.setProperty('--s',s);
document.documentElement.style.setProperty('--v',v);
</script></body></html>
