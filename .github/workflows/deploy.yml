name: Deploy to Turhost

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Kodu indir
        uses: actions/checkout@v4

      - name: 🟢 Node.js 20 kur
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Bağımlılıkları yükle
        run: npm ci

      - name: 🏗️ Build
        run: npm run build

      - name: 🚀 FTP ile Turhost'a yükle
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: public_html/
          local-dir: ./dist/
          # Yüklenmeyecek dosyalar (Turhost'a özgü, silinmemeli)
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**

      - name: ✅ Tamamlandı
        run: echo "Site canlıda → https://okmenhavalandirma.com"
